<svg xmlns="http://www.w3.org/2000/svg" width="520" height="400" viewBox="0 0 520 400" role="img" aria-labelledby="title desc">
  <title id="title">MacBook · tap or hold semicolon on Symbols</title>
  <desc id="desc">For ñ, hold right Command, tap semicolon, release Command and tap N. For the rollover workaround, hold right Command and semicolon together, tap B for underscore, then release both.</desc>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #f6f0e0 }
    .eyebrow { font: 650 16px 'IBM Plex Mono', Menlo, monospace; fill: #bdd0c8 }
    .title { font-size: 42px; font-weight: 720 }
    .cue { font-size: 23px; font-weight: 600; fill: #a3eccb }
    .action { font-size: 23px; font-weight: 600 }
    .hint { font-size: 21px; fill: #bdd0c8 }
    .out { font-size: 39px; font-weight: 700; text-anchor: end }
    .cap { font-size: 28px; font-weight: 700; text-anchor: middle; fill: #183131 }
  </style>
  <rect width="520" height="400" fill="#193132"/>
  <text x="23" y="32" class="eyebrow">MACBOOK   /   KARABINER</text>
  <text x="23" y="79" class="title">Tap or hold semicolon</text>
  <text x="23" y="116" class="cue">Start each gesture holding right ⌘.</text>
  <g transform="translate(23 151)">
    <rect y="3" width="57" height="54" rx="8" fill="#0e2426"/>
    <rect width="57" height="53" rx="8" fill="#ffc28e"/>
    <text x="28.5" y="35" class="cap">;</text>
  </g>
  <text x="95" y="174" class="action">Tap for the tilde accent.</text>
  <text x="95" y="205" class="hint">Release right ⌘, then tap N.</text>
  <text x="490" y="196" class="out">ñ</text>
  <path d="M23 243H497" stroke="#526c68"/>
  <g transform="translate(23 274)">
    <rect y="3" width="57" height="54" rx="8" fill="#0e2426"/>
    <rect width="57" height="53" rx="8" fill="#a3eccb"/>
    <text x="28.5" y="35" class="cap">;</text>
  </g>
  <text x="95" y="297" class="action">Hold for the extra Shift.</text>
  <text x="95" y="328" class="hint">Keep both held and tap B.</text>
  <text x="490" y="315" class="out">_</text>
  <text x="95" y="365" class="hint">Release both keys.</text>
</svg>
